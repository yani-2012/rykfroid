<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RYKFroid – Site en maintenance</title>
  <meta name="description" content="Le site RYKFroid est temporairement en maintenance. Il sera de retour très prochainement." />
  <link rel="icon" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #C9A96E;
      --gold-light: #E2C99A;
      --charcoal: #111318;
      --dark-card: #232838;
      --white: #FEFEFE;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
      font-family: 'DM Sans', system-ui, sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse at top, rgba(107,31,42,.35), transparent 60%),
        var(--charcoal);
      text-align: center;
    }
    .box {
      max-width: 560px; width: 100%;
      padding: 48px 32px;
      background: rgba(35,40,56,.55);
      border: 1px solid rgba(201,169,110,.2);
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(201,169,110,.12);
    }
    .logo { display: block; width: 120px; height: auto; margin: 0 auto 28px; }
    .tag {
      display: block; margin-bottom: 18px; padding-left: .2em;
      font-size: .75rem; letter-spacing: .2em; text-transform: uppercase;
      color: var(--gold);
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.15;
      margin-bottom: 18px;
    }
    h1 em { color: var(--gold-light); font-style: italic; }
    p { font-weight: 300; line-height: 1.7; color: rgba(254,254,254,.75); }
    .line { width: 60px; height: 1px; background: var(--gold); margin: 28px auto 0; opacity: .6; }
  </style>
</head>
<body>
  <main class="box">
    <img class="logo" src="/logo.png" alt="RYKFroid" />
    <span class="tag">Maintenance en cours</span>
    <h1>Notre site fait peau <em>neuve</em></h1>
    <p>Nous apportons quelques améliorations à notre site.<br />Il sera de retour très prochainement. Merci de votre patience.</p>
    <div class="line"></div>
  </main>
</body>
</html>
